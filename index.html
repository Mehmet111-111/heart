<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
canvas { display: block; max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H, CX, CY;

function heartX(a) { return 16 * Math.pow(Math.sin(a), 3); }
function heartY(a) { return -(13*Math.cos(a) - 5*Math.cos(2*a) - 2*Math.cos(3*a) - Math.cos(4*a)); }
function hsl(h,s,l,a) { return `hsla(${h},${s}%,${l}%,${a})`; }
function ease(t) { return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function lerp(a,b,t) { return a+(b-a)*t; }
function dst(x1,y1,x2,y2) { return Math.sqrt((x2-x1)**2+(y2-y1)**2); }

const TOTAL = 380;
const CYCLE = 1100;

const particleData = [];
for (let i = 0; i < TOTAL; i++) {
  const angle = (i/TOTAL)*Math.PI*2;
  const spiralOff = (Math.random()-0.5)*0.6;
  const scatterDist = 100 + Math.random()*150;
  const spiralAngle = angle + Math.PI*0.8 + spiralOff;
  particleData.push({
    origAngle: angle, spiralAngle, scatterDist,
    size: 1.5 + Math.random()*2,
    hue: 335 + Math.random()*35,
    sat: 65 + Math.random()*25,
    light: 55 + Math.random()*20,
    phase: Math.random()*Math.PI*2,
    wobble: 0.3 + Math.random()*0.6
  });
}

const particles = [];
const shimmerData = [];
for (let i = 0; i < 35; i++) {
  shimmerData.push({
    rx: Math.random(), ry: Math.random(),
    x: 0, y: 0,
    size: 0.3 + Math.random()*1,
    speed: 0.2 + Math.random()*0.6,
    phase: Math.random()*Math.PI*2
  });
}

function buildParticles() {
  const s = Math.min(W, H) / 500;
  particles.length = 0;
  for (const pd of particleData) {
    const hx = CX + heartX(pd.origAngle)*9*s;
    const hy = CY + heartY(pd.origAngle)*9*s;
    const d = pd.scatterDist * s;
    const sx = hx + Math.cos(pd.spiralAngle)*d;
    const sy = hy + Math.sin(pd.spiralAngle)*d;
    const distFromCenter = dst(hx, hy, CX, CY);
    particles.push({
      homeX: hx, homeY: hy,
      scatterX: sx, scatterY: sy,
      x: hx, y: hy,
      size: pd.size, hue: pd.hue, sat: pd.sat, light: pd.light,
      phase: pd.phase, wobble: pd.wobble,
      delay: distFromCenter / (200*s),
      angle: pd.origAngle
    });
  }
}

function resize() {
  W = c.width = window.innerWidth;
  H = c.height = window.innerHeight;
  CX = W/2; CY = H/2 + 10;
  buildParticles();
  shimmerData.forEach(sh => { sh.x = sh.rx*W; sh.y = sh.ry*H; });
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
}

let frame = 0;
const pulseRings = [];
let lastCycle = -1;

function getCycleT(f) { return (f % CYCLE) / CYCLE; }
function getScale() { return Math.min(W, H) / 500; }

function drawShimmer() {
  for (const s of shimmerData) {
    const f = 0.08 + (Math.sin(frame*0.008*s.speed+s.phase)*0.5+0.5)*0.35;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
    ctx.fillStyle = hsl(0,0,85,f); ctx.fill();
  }
}

function drawGhostHeart(alpha) {
  if (alpha < 0.005) return;
  const s = getScale();
  ctx.save(); ctx.translate(CX, CY); ctx.beginPath();
  for (let a = 0; a <= Math.PI*2; a += 0.01) {
    if (a===0) ctx.moveTo(heartX(a)*9*s, heartY(a)*9*s);
    else ctx.lineTo(heartX(a)*9*s, heartY(a)*9*s);
  }
  ctx.closePath(); ctx.strokeStyle = hsl(350,50,55,alpha);
  ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
}

function drawConnections(t) {
  if (t < 0.65 || t > 0.95) return;
  const connT = (t - 0.65) / 0.3;
  const connAlpha = connT < 0.5 ? connT*2 : (1-connT)*2;
  const maxDist = 45; ctx.lineWidth = 0.5;
  for (let i = 0; i < particles.length; i += 3) {
    for (let j = i+3; j < particles.length; j += 3) {
      const d = dst(particles[i].x, particles[i].y, particles[j].x, particles[j].y);
      if (d < maxDist) {
        const a = (1 - d/maxDist) * connAlpha * 0.15;
        ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = hsl(345, 60, 65, a); ctx.stroke();
      }
    }
  }
}

function spawnPulse() {
  const now = frame;
  pulseRings.push({ born: now });
  pulseRings.push({ born: now + 18 });
  pulseRings.push({ born: now + 40 });
}

function drawPulseRings() {
  const s = getScale();
  for (let i = pulseRings.length - 1; i >= 0; i--) {
    const r = pulseRings[i];
    if (frame < r.born) continue;
    const age = (frame - r.born) / 120;
    if (age > 1) { pulseRings.splice(i, 1); continue; }
    const scale = 0.65 + age * 0.55;
    const alpha = (1 - age) * (1 - age) * 0.22;
    ctx.save(); ctx.translate(CX, CY); ctx.beginPath();
    for (let a = 0; a <= Math.PI*2; a += 0.01) {
      const x = heartX(a)*9*s*scale; const y = heartY(a)*9*s*scale;
      if (a===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.strokeStyle = hsl(345, 70, 65, alpha);
    ctx.lineWidth = 1.5*(1 - age*0.5); ctx.stroke(); ctx.restore();
  }
}

function animate() {
  frame++;
  ctx.fillStyle = 'rgba(0,0,0,0.11)';
  ctx.fillRect(0, 0, W, H);
  drawShimmer();

  const t = getCycleT(frame);
  const currentCycle = Math.floor(frame / CYCLE);

  if (currentCycle !== lastCycle && lastCycle !== -1) spawnPulse();
  lastCycle = currentCycle;

  let scatter, ghostAlpha;

  if (t < 0.25) {
    scatter = 0;
    ghostAlpha = 0.05;
  } else if (t < 0.5) {
    const p = (t - 0.25) / 0.25;
    scatter = ease(p);
    ghostAlpha = 0.05 * (1 - ease(p));
  } else if (t < 0.6) {
    scatter = 1;
    ghostAlpha = 0;
  } else {
    const p = (t - 0.6) / 0.4;
    scatter = 1 - ease(p);
    ghostAlpha = 0.05 * ease(p);
  }

  drawGhostHeart(ghostAlpha);

  for (const p of particles) {
    const wobAmt = scatter * 2 + (1 - scatter) * 0.5;
    const wobX = Math.sin(t * Math.PI * 2 + p.phase) * p.wobble * wobAmt;
    const wobY = Math.cos(t * Math.PI * 2 + p.phase * 1.3) * p.wobble * wobAmt;

    let delayedScatter;
    if (scatter <= 0) {
      delayedScatter = 0;
    } else if (scatter >= 1) {
      delayedScatter = 1;
    } else if (t < 0.5) {
      delayedScatter = Math.max(0, Math.min(1, (scatter - p.delay * 0.3) / (1 - p.delay * 0.3)));
      delayedScatter = ease(delayedScatter);
    } else {
      const gatherProgress = 1 - scatter;
      const delayedGather = Math.max(0, Math.min(1, (gatherProgress - (1 - p.delay) * 0.3) / (1 - (1 - p.delay) * 0.3)));
      delayedScatter = 1 - ease(delayedGather);
    }

    const spiralT = delayedScatter * Math.PI * 1.2;
    const spiralR = delayedScatter * 15;
    const baseX = lerp(p.homeX, p.scatterX, delayedScatter);
    const baseY = lerp(p.homeY, p.scatterY, delayedScatter);
    const tx = baseX + Math.cos(p.angle + spiralT) * spiralR + wobX;
    const ty = baseY + Math.sin(p.angle + spiralT) * spiralR + wobY;
    const alpha = lerp(0.85, 0.3, delayedScatter);

    p.x = tx; p.y = ty;

    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = hsl(p.hue, p.sat, p.light, alpha); ctx.fill();
  }

  drawConnections(t);
  drawPulseRings();

  if (t < 0.25) {
    const sc = getScale();
    const glow = ctx.createRadialGradient(CX, CY, 0, CX, CY, 85 * sc);
    glow.addColorStop(0, hsl(345, 70, 60, 0.05 + Math.sin(t * Math.PI * 2) * 0.02));
    glow.addColorStop(1, hsl(345, 70, 60, 0));
    ctx.fillStyle = glow; ctx.fillRect(CX - 90 * sc, CY - 90 * sc, 180 * sc, 180 * sc);
  }

  requestAnimationFrame(animate);
}

window.addEventListener('resize', resize);
resize();
animate();
</script>
</body>
</html>
